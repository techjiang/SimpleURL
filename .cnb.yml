# 流水线：安装依赖 -> 测试 -> 构建镜像
main:
  push:
    - stages:
        - name: test
          type: docker:image
          image: python:3.12-slim
          volumes:
            - name: pip-cache
              path: /root/.cache/pip
          script:
            - pip install -q -r requirements-dev.txt
            - pytest -q app/tests
  pull_request:
    - stages:
        - name: test
          type: docker:image
          image: python:3.12-slim
          volumes:
            - name: pip-cache
              path: /root/.cache/pip
          script:
            - pip install -q -r requirements-dev.txt
            - pytest -q app/tests
