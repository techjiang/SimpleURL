{% extends "base.html" %}
{% block title %}{{ site_name }} · 链接不可用{% endblock %}
{% block content %}
<section class="gone">
  <img src="/static/logo/icon.svg" alt="" width="64" height="64" />
  <p class="kicker">{{ code }}</p>
  <h1>{{ message }}</h1>
  {% if detail is defined and detail %}
  <p class="lede">{{ detail }}</p>
  {% endif %}
  <div class="gone-actions">
    {% if action_url is defined and action_url %}
    <a class="btn ghost" href="{{ action_url }}">{{ action_label or '继续' }}</a>
    {% endif %}
    <a class="btn primary" href="/">回到首页</a>
  </div>
</section>
{% endblock %}
