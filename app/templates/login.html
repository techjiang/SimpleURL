{% extends "base.html" %}
{% block title %}管理员登录 · {{ site_name }}{% endblock %}
{% block content %}
<section class="gate">
  <div class="gate-card">
    <img src="/static/logo/icon.svg" alt="" width="44" height="44" />
    <h1>管理员登录</h1>
    <p class="gate-tip" id="gate-tip">{{ message or "该页面需要管理员身份" }}</p>
    {% if access and access.admin_login_enabled %}
    <form id="login-form" autocomplete="off">
      <div class="field main">
        <label for="login-secret">管理密钥 <span class="hint">即服务端 ADMIN_TOKEN</span></label>
        <input id="login-secret" name="secret" type="password" placeholder="输入管理密钥" required />
      </div>
      <div class="composer-actions">
        <button type="submit" class="btn primary" id="login-btn">登录</button>
        <span class="status" id="login-status" role="status" aria-live="polite"></span>
      </div>
    </form>
    {% else %}
    <p class="gate-hint">服务端未配置 <code>ADMIN_TOKEN</code>，管理功能未启用。</p>
    {% endif %}
    <div class="gate-back"><a class="btn tiny ghost" href="/">← 返回首页</a></div>
  </div>
</section>
{% endblock %}
