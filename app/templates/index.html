{% extends "base.html" %}
{% block content %}
<div class="mode-banner" id="mode-banner" hidden>
  <span class="mode-dot"></span>
  <span id="mode-text"></span>
  <a class="btn tiny ghost" href="/admin" id="mode-action">后台</a>
</div>

<div class="notice-bar" id="notice-bar" hidden role="status">
  <span class="notice-dot" aria-hidden="true"></span>
  <span id="notice-text"></span>
</div>

<section class="hero">
  <div class="hero-copy">
    <p class="kicker">轻量 · 流畅 · 好用</p>
    <h1>把冗长的链接<br /><span class="grad">收进一行短码</span></h1>
    <p class="lede">粘贴链接，回车即得。自带访问统计、二维码与标签管理，全程自托管。</p>
  </div>
</section>

<section class="composer" id="create">
  <form id="create-form" class="composer-form" autocomplete="off">
    <div class="field main">
      <label for="target">目标链接</label>
      <input id="target" name="target" type="text" inputmode="url" placeholder="https://example.com/very/long/url" required />
    </div>
    <div class="row">
      <div class="field">
        <label for="code">自定义短码 <span class="hint">留空自动生成</span></label>
        <input id="code" name="code" type="text" placeholder="my-link" maxlength="16" />
      </div>
      <div class="field">
        <label for="title">标题 <span class="hint">留空自动获取</span></label>
        <input id="title" name="title" type="text" placeholder="给链接起个好记的名字" maxlength="255" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="tags">标签 <span class="hint">逗号分隔</span></label>
        <input id="tags" name="tags" type="text" placeholder="活动, 文档" maxlength="200" />
      </div>
      <div class="field">
        <label for="expires_at">过期时间 <span class="hint">可选，如 2026-12-31 23:59</span></label>
        <input id="expires_at" name="expires_at" type="datetime-local" placeholder="2026-12-31 23:59" />
      </div>
    </div>
    <div class="composer-actions">
      <button type="submit" class="btn primary" id="submit-btn">生成短链接</button>
      <span class="status" id="create-status" role="status" aria-live="polite"></span>
    </div>
  </form>
  <div class="result" id="result" hidden>
    <div class="result-card">
      <p class="result-label">你的短链接</p>
      <div class="result-main">
        <a id="result-link" href="#" target="_blank" rel="noopener"></a>
        <button class="btn ghost copy" id="copy-btn" type="button">复制</button>
      </div>
      <div class="result-meta">
        <img id="result-qr" alt="二维码" width="96" height="96" />
        <p class="hint title-source" id="result-title-hint" hidden></p>
        <div class="result-tags" id="result-tags"></div>
      </div>
      <div class="receipt" id="receipt" hidden>
        <p class="receipt-label">回执链接 · 凭它查看这条链接的统计，只给一次，请自己存好</p>
        <div class="result-main">
          <a id="receipt-link" href="#" target="_blank" rel="noopener"></a>
          <button class="btn ghost copy" id="receipt-copy" type="button">复制</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="board" id="list">
  <div class="board-head">
    <h2>链接库</h2>
    <div class="board-tools">
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 21l-4.3-4.3M17 10a7 7 0 11-14 0 7 7 0 0114 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="搜索短码 / 目标 / 标题" />
      </div>
      <select id="tag-filter" aria-label="标签筛选">
        <option value="">全部标签</option>
      </select>
      <select id="status-filter" aria-label="状态筛选">
        <option value="">全部状态</option>
        <option value="enabled">已启用</option>
        <option value="disabled">已停用</option>
        <option value="expired">已过期</option>
        <option value="expiring">即将过期（7 天内）</option>
      </select>
      <select id="sort-select" aria-label="排序方式">
        <option value="created_desc">最近创建</option>
        <option value="created_asc">最早创建</option>
        <option value="clicks_desc">点击最多</option>
        <option value="clicks_asc">点击最少</option>
        <option value="code_asc">短码排序</option>
      </select>
      <select id="page-size" aria-label="每页条数">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
        <option value="100">100 条/页</option>
      </select>
      <button class="btn ghost" id="export-btn" type="button" title="按当前筛选导出 CSV">导出 CSV</button>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>短码</th><th>目标</th><th class="col-clicks">点击</th><th>标签</th><th>状态</th><th>过期</th><th>创建</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="links-body"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <img src="/static/logo/icon.svg" alt="" width="44" height="44" />
      <p>还没有链接，先创建一个吧</p>
    </div>
  </div>
  <div class="pager">
    <button class="btn ghost" id="prev-btn" type="button">上一页</button>
    <span id="page-info"></span>
    <button class="btn ghost" id="next-btn" type="button">下一页</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal" id="edit-modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <form class="modal-card" id="edit-form" autocomplete="off">
    <div class="modal-head">
      <h3>编辑 <span class="mono" id="edit-code"></span></h3>
      <button class="btn tiny ghost" type="button" data-close="1">关闭</button>
    </div>
    <div class="field">
      <label for="edit-target">目标链接</label>
      <input id="edit-target" name="target" type="url" required />
    </div>
    <div class="row">
      <div class="field">
        <label for="edit-title">标题</label>
        <input id="edit-title" name="title" type="text" maxlength="255" />
      </div>
      <div class="field">
        <label for="edit-tags">标签 <span class="hint">逗号分隔</span></label>
        <input id="edit-tags" name="tags" type="text" maxlength="200" />
      </div>
    </div>
    <div class="field">
      <label for="edit-expires">过期时间 <span class="hint">留空表示永不过期</span></label>
      <input id="edit-expires" name="expires_at" type="datetime-local" />
    </div>
    <div class="modal-actions">
      <button type="submit" class="btn primary" id="edit-save">保存</button>
      <span class="status" id="edit-status" role="status" aria-live="polite"></span>
    </div>
  </form>
</div>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <img src="/static/logo/icon.svg" alt="" width="40" height="40" />
    <h3>此站点需要访问令牌</h3>
    <p class="hint">请输入部署时配置的 ACCESS_TOKEN</p>
    <input id="gate-token" type="password" placeholder="访问令牌" autocomplete="current-password" />
    <button class="btn primary" type="submit">进入</button>
  </form>
</div>
{% endblock %}
